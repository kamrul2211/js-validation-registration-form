<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="my-4">
                <h1 class="text-primary text-center ">Registration Form</h1>
            </div>
            <div class="col w-50 mx-auto">
                <div class="form-group">
                    <label class="mb-2" for="">Name</label>
                    <input id="getName" class="form-control" type="text " placeholder="Enter name">
                </div>
                <div class="form-group">
                    <label class="mb-2" for="">Email</label>
                    <input id="getEmail" class="form-control" type="email" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label class="mb-2" for="">Phone</label>
                    <input id="getNumber" class="form-control" type="number" placeholder="Enter phone">
                </div>
                <div class="form-group">
                    <label class="mb-2" for="">Password</label>
                    <input id="getPassword" class="form-control" type="text " placeholder="Enter Password">
                </div>
                <div class="form-group">
                    <button onclick="getdata()" class="btn btn-success mt-2">Submit</button>
                </div>
            </div>
        </div>
    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>

</html>
